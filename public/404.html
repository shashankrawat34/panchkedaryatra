<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Panch Kedar Yatra</title>
    <script>
      // Single-page app redirect for static hosting (GitHub Pages, etc.)
      // Redirects 404s back to index.html so React Router can handle routing.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
